name: Daily Build Proxy Rules Factory

permissions:
  contents: write

on:
  schedule:
    # 每天北京时间 04:00 (UTC 20:00) 自动同步社区最新规则并重新治理打包
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'scripts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install --no-cache-dir pyyaml

      - name: Run Rules Factory Engine
        run: python3 scripts/build_factory.py

      - name: Commit & Push updated dist artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No rule changes today."
          else
            git commit -m "chore(rules): automated daily sync & governance update [skip ci]"
            git push
          fi
